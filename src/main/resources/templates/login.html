<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/nav :: head}"></th:block>
    <title>Entrar — Stock Multimarca</title>
</head>
<body>
<header th:replace="~{fragmentos/nav :: nav('')}"></header>

<main class="login-banda">
    <div class="login-caja">
        <div class="marca-login logo">
            <svg th:replace="~{fragmentos/nav :: logo}"></svg>
            STOCK <span>multimarca</span>
        </div>
        <h1>Entrar</h1>
        <p class="chico">Con el usuario y la contraseña que te dio el administrador.</p>

        <p class="msg msg-error" th:if="${param.error}">El usuario o la contraseña no coinciden.</p>
        <p class="msg msg-ok" th:if="${param.logout}">Cerraste la sesión.</p>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="username">Usuario</label>
                <input class="ancho" id="username" name="username" autocomplete="username"
                       autocapitalize="none" spellcheck="false" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input class="ancho" id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p class="chico" style="margin:16px 0 0">¿No tenés usuario? Pedíselo al administrador.</p>
    </div>
</main>
</body>
</html>
