<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fila de la grilla de "Mi stock" (variable i). Doble clic = corregirla en el lugar. -->
<table><tbody>
<tr th:fragment="fila" th:id="${'item-' + i.id}" title="Doble clic para corregir"
    th:attr="hx-get=@{/mi-stock/items/{id}/editar(id=${i.id})}" hx-trigger="dblclick"
    hx-target="this" hx-swap="outerHTML">
    <td class="codigo" th:text="${i.codigoOriginal}"></td>
    <td th:text="${i.descripcion ?: '—'}"></td>
    <td th:text="${i.vehiculo ?: '—'}"></td>
    <td th:text="${i.marca != null ? i.marca.etiqueta : 'Sin marca'}"
        th:classappend="${i.marca == null} ? 'chico' : ''"></td>
    <td class="der" th:text="${i.cantidad ?: 'Consultar'}"></td>
    <td class="der" th:text="${i.precioUsd != null ? #numbers.formatDecimal(i.precioUsd, 1, 'POINT', 2, 'COMMA') : 'Consultar'}"></td>
    <td class="acciones-fila">
        <button type="button" class="btn-icono"
                th:attr="hx-get=@{/mi-stock/items/{id}/editar(id=${i.id})}, aria-label=${'Editar ' + i.codigoOriginal}"
                title="Editar" hx-target="closest tr" hx-swap="outerHTML"><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 20h9'/><path d='M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'/></svg></button>
        <form th:action="@{/mi-stock/items/{id}/borrar(id=${i.id})}" method="post"
              th:attr="hx-post=@{/mi-stock/items/{id}/borrar(id=${i.id})},
                       hx-confirm=${'¿Borrar ' + i.codigoOriginal + ' de tu stock?'}"
              hx-target="closest tr" hx-swap="outerHTML">
            <button type="submit" class="btn-icono btn-icono-peligro" title="Borrar"
                    th:attr="aria-label=${'Borrar ' + i.codigoOriginal}"><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M3 6h18'/><path d='M8 6V4h8v2'/><path d='M19 6l-1 14H6L5 6'/><path d='M10 11v6M14 11v6'/></svg></button>
        </form>
    </td>
</tr>

<!-- La misma fila, editable en el lugar: cada celda es un campo de su columna (variables i, f, errores,
     marcasVendedor). Los campos se asocian al formulario de la última celda con el atributo form.
     Enter guarda; Escape cancela. -->
<tr th:fragment="editar" th:id="${'item-' + i.id}" class="fila-edicion"
    th:attr="hx-get=@{/mi-stock/items/{id}(id=${i.id})}" hx-trigger="keyup[key=='Escape']"
    hx-target="this" hx-swap="outerHTML"
    th:with="formId=${'item-form-' + i.id}">
    <td><input name="codigo" th:value="${f.codigo}" required maxlength="80" autocomplete="off" autofocus
               th:attr="form=${formId}" aria-label="Código"></td>
    <td><input name="descripcion" th:value="${f.descripcion}" maxlength="300" th:attr="form=${formId}"
               aria-label="Descripción">
        <ul class="errores-fila" th:unless="${#lists.isEmpty(errores)}">
            <li th:each="e : ${errores}" th:text="${e}"></li>
        </ul>
    </td>
    <td><input th:replace="~{fragmentos/item-stock :: vehiculoInput}"></td>
    <td><select th:replace="~{fragmentos/item-stock :: marcaSelect}"></select></td>
    <td><input name="cantidad" th:value="${f.cantidad}" inputmode="numeric" class="der corto"
               th:attr="form=${formId}" aria-label="Cantidad" placeholder="consultar"></td>
    <td><input name="precio" th:value="${f.precio}" inputmode="decimal" class="der corto"
               th:attr="form=${formId}" aria-label="Precio USD" placeholder="consultar"></td>
    <td class="acciones-fila">
        <form th:id="${formId}" th:action="@{/mi-stock/items/{id}(id=${i.id})}" method="post"
              th:attr="hx-post=@{/mi-stock/items/{id}(id=${i.id})}" hx-target="closest tr" hx-swap="outerHTML">
            <button type="submit" class="btn-icono btn-icono-ok" title="Guardar" aria-label="Guardar"><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M20 6L9 17l-5-5'/></svg></button>
        </form>
        <button type="button" class="btn-icono" title="Cancelar" aria-label="Cancelar"
                th:attr="hx-get=@{/mi-stock/items/{id}(id=${i.id})}" hx-target="closest tr" hx-swap="outerHTML"><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M18 6L6 18M6 6l12 12'/></svg></button>
    </td>
</tr>
</tbody></table>

<!-- Panel "Agregar repuesto" (variables f, errores, ok, marcasVendedor). -->
<div th:fragment="nuevo" id="itemNuevo" class="item-nuevo">
    <form class="item-form" id="item-nuevo-form" th:action="@{/mi-stock/items}" method="post"
          hx-post="/mi-stock/items" hx-target="#itemNuevo" hx-swap="outerHTML"
          th:with="formId='item-nuevo-form'">
        <h3>Agregar repuesto</h3>
        <p class="msg msg-ok" th:if="${ok}" th:text="${ok}"></p>
        <div class="item-campos">
            <label>Código *
                <input name="codigo" th:value="${f.codigo}" required maxlength="80" autocomplete="off"
                       placeholder="Ej: AB3Z-1125-A">
            </label>
            <label class="ancho-2">Descripción
                <input name="descripcion" th:value="${f.descripcion}" maxlength="300" placeholder="Ej: Disco de freno delantero">
            </label>
            <label>Vehículo / modelo
                <input th:replace="~{fragmentos/item-stock :: vehiculoInput}">
            </label>
            <label>Marca del vehículo
                <select th:replace="~{fragmentos/item-stock :: marcaSelect}"></select>
            </label>
            <label>Cantidad
                <input name="cantidad" th:value="${f.cantidad}" inputmode="numeric" placeholder="Ej: 4 o consultar">
            </label>
            <label>Precio USD
                <input name="precio" th:value="${f.precio}" inputmode="decimal" placeholder="Vacío = a consultar">
            </label>
        </div>
        <ul class="msg msg-error" th:unless="${#lists.isEmpty(errores)}">
            <li th:each="e : ${errores}" th:text="${e}"></li>
        </ul>
        <div class="item-form-botones">
            <button type="submit">Agregar</button>
            <button type="button" class="btn-enlace" hx-get="/mi-stock/items/cerrar"
                    hx-target="#itemNuevo" hx-swap="outerHTML">Cerrar</button>
        </div>
    </form>
</div>

<!-- Lugar del panel cuando está cerrado. -->
<div th:fragment="cerrado" id="itemNuevo">
    <button type="button" class="btn-secundario" hx-get="/mi-stock/items/nuevo"
            hx-target="#itemNuevo" hx-swap="outerHTML">+ Agregar repuesto</button>
</div>

<!-- Vehículo (variables f, formId): al cambiarlo se vuelve a buscar la marca y se reemplaza la lista de marcas. -->
<input th:fragment="vehiculoInput" name="vehiculo" th:value="${f.vehiculo}" maxlength="150" autocomplete="off"
       placeholder="Ej: Ranger 2015" aria-label="Vehículo"
       th:attr="form=${formId}, hx-get=@{/mi-stock/items/marca-detectada(formId=${formId})},
                hx-target=${'#' + formId + '-marca'}"
       hx-trigger="input changed delay:500ms" hx-swap="outerHTML" hx-sync="this:replace">

<!-- Marca (variables f, formId, marcasVendedor). Elegir una a mano después del vehículo la fija. -->
<select th:fragment="marcaSelect" name="marca" th:id="${formId + '-marca'}" th:attr="form=${formId}"
        aria-label="Marca del vehículo">
    <option value="" th:selected="${f.marca == ''}">Automática</option>
    <option th:each="m : ${marcasVendedor}" th:value="${m.id}" th:text="${m.etiqueta}"
            th:selected="${f.marca == m.id.toString()}"></option>
</select>

</body>
</html>
