# Ambiente único: base + app + túnel de Cloudflare (https://stock.gochosoftware.com).
# Todo arranca solo cuando arranca Docker.
#   Levantar / redeploy:  docker compose up -d --build
#   Ver estado:           docker compose ps
#   Logs de la app:       docker compose logs -f app
# La base escucha en localhost:5434 (DBeaver). mvn spring-boot:run usa esta misma base.
name: ssap-server

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockautopartes
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"   # solo accesible desde esta PC (para DBeaver/pgAdmin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stockautopartes"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockautopartes
      DB_USER: stock
      DB_PASSWORD: ${DB_PASSWORD}
      OTP_EN_PANTALLA: "false"
      APP_URL: https://stock.gochosoftware.com
      # Alta automática (issue #1). Cerrada hasta configurar SMS y email: en este servidor el modo prueba
      # no muestra códigos ni links, así que nadie podría terminar de registrarse.
      REGISTRO_HABILITADO: ${REGISTRO_HABILITADO:-false}
      # true = el alta también pide el código por SMS (segunda etapa)
      VERIFICAR_TELEFONO: ${VERIFICAR_TELEFONO:-false}
      # Código por SMS: OTP_CANAL=sms + datos de Twilio en .env
      OTP_CANAL: ${OTP_CANAL:-prueba}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # Emails (activación y recuperar contraseña): EMAIL_HABILITADO=true + datos SMTP en .env
      EMAIL_HABILITADO: ${EMAIL_HABILITADO:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Stock Multimarca <noresponder@gochosoftware.com>}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      TZ: America/Caracas
    ports:
      - "127.0.0.1:8081:8080"   # para probar desde esta PC: http://localhost:8081

  # Túnel rápido (solo si hace falta una URL temporal): docker compose --profile rapido up -d
  tunel-rapido:
    image: cloudflare/cloudflared:latest
    profiles: ["rapido"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://app:8080
    depends_on: [app]

  # Túnel fijo (stock.gochosoftware.com). Necesita TUNNEL_TOKEN en .env.
  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [app]

volumes:
  pgdata:   # volumen ssap-server_pgdata
